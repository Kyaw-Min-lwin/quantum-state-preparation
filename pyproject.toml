[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-state-preparation"
version = "0.1.0"
description = "Final-year project: goal-conditioned quantum state preparation"
requires-python = ">=3.12"
dependencies = [
    "qiskit>=2,<3",
    "numpy",
    "gymnasium",
    "torch",
    "matplotlib",
    "pylatexenc",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ipykernel",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]